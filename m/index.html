<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHOT — Moodboard</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --surface: #151517;
    --text: #f2f2f7;
    --text-dim: #8e8e93;
    --accent: #0a84ff;
    --border: #2c2c2e;
    --danger: #ff453a;
    --maxw: 720px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  header.page {
    padding-bottom: 16px;
    margin-bottom: 20px;
  }
  .brand {
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px;
  }
  h1 {
    font-size: 22px;
    font-weight: 800;
    margin: 0;
    word-break: break-word;
  }
  .state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 64px 16px;
    text-align: center;
    color: var(--text-dim);
  }
  .state.error { color: var(--danger); }
  .spinner {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  @media (min-width: 480px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
  .grid button {
    padding: 0;
    border: 0;
    background: var(--surface);
    border-radius: 10px;
    overflow: hidden;
    aspect-ratio: 1 / 1;
    cursor: pointer;
  }
  .grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .viewer {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.96);
    display: none;
    flex-direction: column;
    z-index: 10;
  }
  .viewer.open { display: flex; }
  .viewer-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
  }
  .viewer-counter { color: var(--text-dim); font-size: 13px; font-weight: 600; }
  .viewer-close {
    background: none;
    border: 0;
    color: var(--accent);
    font-size: 22px;
    line-height: 1;
    padding: 6px;
    cursor: pointer;
  }
  .viewer-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    touch-action: pan-y;
  }
  .viewer-body img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .viewer-nav {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 25%;
    background: none;
    border: 0;
    cursor: pointer;
    color: transparent;
  }
  .viewer-nav.prev { left: 0; }
  .viewer-nav.next { right: 0; }
  footer.page {
    margin-top: 48px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <p class="brand">SHOT</p>
    <h1 id="title">Moodboard</h1>
  </header>

  <div id="state" class="state">
    <div class="spinner"></div>
    <p>Загрузка…</p>
  </div>

  <div id="grid" class="grid" style="display:none"></div>

  <footer class="page">Referenced by a photographer using SHOT</footer>
</div>

<div id="viewer" class="viewer">
  <div class="viewer-top">
    <span id="viewerCounter" class="viewer-counter"></span>
    <button type="button" class="viewer-close" id="viewerClose" aria-label="Закрыть">✕</button>
  </div>
  <div class="viewer-body" id="viewerBody">
    <img id="viewerImage" src="" alt="">
    <button type="button" class="viewer-nav prev" id="viewerPrev" aria-label="Предыдущее"></button>
    <button type="button" class="viewer-nav next" id="viewerNext" aria-label="Следующее"></button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // Filled in at deploy time — the real deployed resolve-shared-moodboard
  // Edge Function URL. This page is static (no build step, no env vars),
  // so this is one of the two lines that must be edited before publishing.
  var RESOLVE_URL = 'https://ejoybkmuayonhefjmkpf.supabase.co/functions/v1/resolve-shared-moodboard';

  // Supabase Edge Functions require a valid Authorization header to pass
  // the PLATFORM's own gateway JWT check, before the function's own code
  // ever runs — this is enforced above/outside resolve-shared-moodboard's
  // own handler, which itself never reads or checks this header (the
  // handler's only real credential is the `token` in the POST body).
  // Without it, every call fails with 401 "Missing authorization header"
  // from the Supabase gateway itself (sb-error-code: UNAUTHORIZED_NO_AUTH_HEADER)
  // — confirmed directly against this project's deployment. This mirrors
  // exactly what the SHOT mobile app itself already does for every other
  // Edge Function call (see src/services/aiPlanClient.ts etc.) — the anon
  // key is a public, embeddable identifier by Supabase's own design, safe
  // to ship in client code (mobile bundle or, here, a static public page),
  // not a secret.
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqb3lia211YXlvbmhlZmpta3BmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTUzMTIsImV4cCI6MjEwMTc3MTMxMn0.ui1qXn0RPi63aJferYZgtdJG6u5AzSJKqWnkLaKjmTk';

  var titleEl = document.getElementById('title');
  var stateEl = document.getElementById('state');
  var gridEl = document.getElementById('grid');
  var viewerEl = document.getElementById('viewer');
  var viewerBody = document.getElementById('viewerBody');
  var viewerImage = document.getElementById('viewerImage');
  var viewerCounter = document.getElementById('viewerCounter');

  function showState(message, isError) {
    stateEl.style.display = 'flex';
    stateEl.className = 'state' + (isError ? ' error' : '');
    gridEl.style.display = 'none';
    stateEl.innerHTML = isError ? '' : '<div class="spinner"></div>';
    var p = document.createElement('p');
    p.textContent = message;
    stateEl.appendChild(p);
  }

  function getToken() {
    var params = new URLSearchParams(window.location.search);
    return params.get('t') || '';
  }

  var items = [];
  var currentIndex = -1;

  function openViewer(index) {
    currentIndex = index;
    viewerImage.src = items[index].signedImageUrl;
    viewerCounter.textContent = (index + 1) + ' / ' + items.length;
    viewerEl.classList.add('open');
  }

  function closeViewer() {
    viewerEl.classList.remove('open');
    viewerImage.src = '';
  }

  function showRelative(delta) {
    if (currentIndex < 0) return;
    var next = currentIndex + delta;
    if (next < 0 || next >= items.length) return;
    openViewer(next);
  }

  document.getElementById('viewerClose').addEventListener('click', closeViewer);
  document.getElementById('viewerPrev').addEventListener('click', function () { showRelative(-1); });
  document.getElementById('viewerNext').addEventListener('click', function () { showRelative(1); });
  document.addEventListener('keydown', function (e) {
    if (!viewerEl.classList.contains('open')) return;
    if (e.key === 'Escape') closeViewer();
    if (e.key === 'ArrowLeft') showRelative(-1);
    if (e.key === 'ArrowRight') showRelative(1);
  });

  // Minimal touch-swipe support — no gesture library, just a horizontal
  // drag-distance threshold on the fullscreen image.
  var touchStartX = null;
  viewerBody.addEventListener('touchstart', function (e) {
    touchStartX = e.touches[0].clientX;
  });
  viewerBody.addEventListener('touchend', function (e) {
    if (touchStartX === null) return;
    var deltaX = e.changedTouches[0].clientX - touchStartX;
    touchStartX = null;
    if (Math.abs(deltaX) < 40) return;
    showRelative(deltaX > 0 ? -1 : 1);
  });

  function renderGrid() {
    gridEl.innerHTML = '';
    items.forEach(function (item, index) {
      var button = document.createElement('button');
      button.type = 'button';
      var img = document.createElement('img');
      img.src = item.signedImageUrl;
      img.alt = '';
      img.loading = 'lazy';
      button.appendChild(img);
      button.addEventListener('click', function () { openViewer(index); });
      gridEl.appendChild(button);
    });
    stateEl.style.display = 'none';
    gridEl.style.display = 'grid';
  }

  function load() {
    var token = getToken();
    if (!token) {
      showState('Ссылка неполная. Проверьте, что скопировали её целиком.', true);
      return;
    }

    fetch(RESOLVE_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + ANON_KEY,
      },
      body: JSON.stringify({ token: token }),
    })
      .then(function (res) {
        if (res.status === 404) {
          showState('Эта ссылка недоступна. Возможно, доступ отключён или ссылка устарела.', true);
          return null;
        }
        if (res.status === 429) {
          showState('Слишком много запросов. Попробуйте немного позже.', true);
          return null;
        }
        if (!res.ok) {
          showState('Не удалось загрузить moodboard. Попробуйте обновить страницу.', true);
          return null;
        }
        return res.json();
      })
      .then(function (body) {
        if (!body) return;
        titleEl.textContent = body.title || 'Moodboard';
        items = Array.isArray(body.items) ? body.items : [];
        if (items.length === 0) {
          showState('В этом moodboard пока нет фотографий.', false);
          return;
        }
        renderGrid();
      })
      .catch(function () {
        showState('Нет соединения. Проверьте интернет и обновите страницу.', true);
      });
  }

  load();
})();
</script>
</body>
</html>
